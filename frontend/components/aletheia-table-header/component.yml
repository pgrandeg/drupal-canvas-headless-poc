name: Aletheia Table header
machineName: aletheia-table-header
status: true
required: []
props:
  properties:
    clickable:
      title: Clickable
      type: boolean
      examples:
        - false
    color:
      title: Color
      type: string
      examples:
        - "primary"
      enum:
        - "primary"
        - "secondary"
      meta:enum:
        primary: "Primary"
        secondary: "Secondary"
    frozen:
      title: Frozen
      type: string
      examples:
        - "first"
      enum:
        - "first"
        - "last"
        - "none"
      meta:enum:
        first: "First"
        last: "Last"
        none: "None"
